name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ビルド & ヘッドレステスト
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # apt ミラーが遅い/ハングすることがあるため、ダウンロード済み .deb をキャッシュする
      - name: apt パッケージのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-gba-v1

      - name: ツールチェーンのインストール
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Dir::Cache::Archives=$HOME/apt-cache"
          for i in 1 2 3; do
            if timeout 180 sudo apt-get $APT update &&
               timeout 900 sudo apt-get $APT install -y --no-install-recommends \
                 gcc-arm-none-eabi libmgba-dev zlib1g-dev; then
              break
            fi
            echo "apt 失敗 (試行 $i)。再試行します"
            sleep 10
          done
          sudo chown -R "$USER" ~/apt-cache
          rm -f ~/apt-cache/lock
          arm-none-eabi-gcc --version | head -1

      - name: ROM ビルド
        run: make -j"$(nproc)"

      - name: ROM サイズ確認
        run: ls -l steel_chain.gba

      - name: スモークテスト (mGBA コアで自動操作)
        run: make test

      - name: ボス戦テスト (ボット戦術で撃破できるか)
        run: |
          build/runner steel_chain.gba build/boss-out boss
          build/runner steel_chain.gba build/boss5-out boss5

      - name: デモプレイ (タイトル放置) テスト
        run: build/runner steel_chain.gba build/attract-out attract

      - name: サウンドテスト (クリア後のおまけ) テスト
        run: build/runner steel_chain.gba build/soundtest-out soundtest

      - name: スコアエクステンド テスト
        run: build/runner steel_chain.gba build/extend-out extend

      - name: ゲームオーバー/コンティニュー テスト
        run: build/runner steel_chain.gba build/gameover-out gameover

      - name: ノーダメージボーナス テスト
        run: build/runner steel_chain.gba build/nodamage-out nodamage

      - name: 全曲の録音 (試聴用 WAV)
        run: build/runner steel_chain.gba build/music-out music

      - name: ステージ別ボット検証 (レポート)
        continue-on-error: true
        run: |
          for s in 1 2 3 4 5; do
            build/runner steel_chain.gba build/stage$s-out stage$s | grep -E "stage end|death|このステージ" | tee -a build/stage-report.txt
          done

      - name: ボット通しプレイ EASY (到達度レポート)
        continue-on-error: true
        run: build/runner steel_chain.gba build/boteasy-out boteasy | grep -E "到達|bot end|death|ending" | tee build/boteasy-report.txt

      - name: ボット通しプレイ HARD (到達度レポート)
        continue-on-error: true
        run: build/runner steel_chain.gba build/bothard-out bothard | grep -E "HP|到達|bot end|death|ending" | tee build/bothard-report.txt

      - name: ボット通しプレイ (到達度レポート)
        run: build/runner steel_chain.gba build/bot-out bot | tee build/bot-report.txt

      - name: 成果物アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steel-chain-${{ github.sha }}
          path: |
            steel_chain.gba
            build/test-out/*.png
            build/test-out/*.wav
            build/music-out/*.wav
            build/bot-out/*.png
            build/boss-out/*.png
            build/boss5-out/*.png
            build/bot-report.txt
            build/stage-report.txt
            build/boteasy-report.txt
            build/bothard-report.txt
          if-no-files-found: warn

  release:
    name: ROM を Release に公開
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steel-chain-${{ github.sha }}
          path: dist
      - name: Release 作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          MSG="$(git log -1 --pretty=%s)"
          cp dist/steel_chain.gba "dist/steel_chain-${TAG}.gba"
          gh release create "$TAG" "dist/steel_chain-${TAG}.gba" \
            --target "${{ github.sha }}" \
            --title "STEEL CHAIN ${TAG}" \
            --notes "自動ビルド (main: ${{ github.sha }})

          最新の変更: ${MSG}

          ダウンロードした .gba を mGBA などの GBA エミュレータで開いて遊べます。"

  pages:
    name: ブラウザ版を GitHub Pages に公開
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steel-chain-${{ github.sha }}
          path: dist
      - name: サイト組み立て
        run: |
          mkdir -p site
          cp web/index.html site/
          cp dist/steel_chain.gba site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
